# ReViva — compila o app iOS na nuvem (Mac do Codemagic) e envia para o TestFlight / App Store Connect.
workflows:
  ios-appstore:
    name: ReViva iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ReViva ASC   # nome da chave de API criada no Codemagic (Team settings > Integrations)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: online.appreviva.app
      vars:
        APP_STORE_APPLE_ID: 6820650035
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    triggering:
      events: []   # roda só quando você clicar em "Start new build"
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Montar projeto iOS
        script: bash scripts/ios-setup.sh
      - name: Assinatura (certificado e perfil)
        script: xcode-project use-profiles
      - name: Número do build
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Gerar .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
