<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REVIVA</title>
<meta name="description" content="Reviva — um jardim para atravessar o luto no seu tempo.">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="/native.js"></script>
<script src="/plantas.js"></script>
<script src="/trilhas.js"></script>
<script src="/conteudo.js"></script>
<script src="/livro.js"></script>
<link rel="manifest" href="/manifest.json">
<script defer src="/_vercel/insights/script.js"></script>
<meta name="theme-color" content="#FBF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REVIVA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#fbf7f2;--cream:#f1eae0;--card:#fff;--border:#e9e0d6;
  --ink:#2e2436;--soft:#544a5e;--mute:#6c6276;
  --plum:#4a3b52;--gold:#c79a4b;--rose:#c08499;--rose2:#a86f8a;--sage:#7c9188;--sky:#7fa1ac;--terra:#9b7e6b;
  --goldSoft:#fff8eb;--goldLine:#efdcb9;--danger:#a4525e;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--cream);font-family:Karla,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
p,h1,h2,h3{margin-top:0}
.stage{height:100%;display:grid;place-items:center;padding:24px 12px}
.phone{width:min(400px,100%);height:min(820px,calc(100vh - 32px));background:var(--bg);border-radius:36px;box-shadow:0 30px 60px -20px rgba(46,36,54,.35),0 0 0 8px #fff,0 0 0 9px var(--border);overflow:hidden;position:relative}
@media(max-width:520px){.stage{padding:0}.phone{width:100%;height:100%;border-radius:0;box-shadow:none}}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.view{flex:1;overflow:auto;scrollbar-width:none;padding-top:var(--safe-t)}
.view::-webkit-scrollbar{display:none}
.pad{padding:0 22px}
.wordmark{display:flex;align-items:center}.wordmark svg{display:block;height:30px;width:auto}
.wordmark strong{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:26px;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 10px}
.title{font-family:Fraunces,Georgia,serif;font-size:22px}
h1{font-family:Fraunces,Georgia,serif;font-size:26px;line-height:1.22;font-weight:500;margin-bottom:0}
h2{font-family:Fraunces,Georgia,serif;font-size:18px;font-weight:500;margin-bottom:0;line-height:1.3}
h3{font-size:14px;font-weight:800;margin-bottom:0}
.body{font-size:15px;line-height:1.6;color:var(--soft)}
.small{font-size:12.5px;color:var(--soft);line-height:1.5}
.eyebrow{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--gold)}
.primary{border:0;border-radius:14px;background:var(--gold);color:#fff;font-weight:800;font-size:15px;padding:15px;width:100%}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{border:1px solid var(--border);border-radius:14px;background:var(--card);font-weight:800;font-size:14.5px;padding:14px;width:100%}
.link{background:none;border:0;color:var(--soft);font-weight:700;font-size:14px;padding:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:10px}
.notice{background:var(--goldSoft);border:1px solid var(--goldLine);border-radius:14px;padding:12px 14px;color:var(--soft);font-size:12.5px;line-height:1.5}
.field{display:grid;gap:7px;color:var(--soft);font-size:12.5px;font-weight:700}
.field input,textarea,select{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--card);font-size:15px;width:100%;outline:none}
.field input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none;min-height:140px;line-height:1.55}
.backbar{display:flex;align-items:center;gap:8px;padding:18px 14px 4px}
.back{background:transparent;border:0;padding:6px 8px;font-size:22px;line-height:1}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:800}
/* onboarding */
.onb{min-height:100%;display:flex;flex-direction:column;padding:42px 26px calc(26px + var(--safe-b))}
.slideArt{flex:1;display:grid;place-items:center;min-height:240px}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.dots i.on{background:var(--plum)}
.navrow{display:flex;justify-content:space-between;align-items:center}
.progress{display:flex;gap:6px;margin-top:26px}
.progress i{height:4px;flex:1;border-radius:4px;background:var(--border)}
.progress i.on{background:var(--gold)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.choice{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;text-align:left;font-weight:700;font-size:15px;gap:10px}
.choice.selected{border-color:var(--gold);background:var(--goldSoft)}
.choice span{font-weight:500;color:var(--soft);font-size:12.5px;display:block;margin-top:3px}
.consent{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;font-size:13px;line-height:1.5;color:var(--soft);padding:12px 0;border-bottom:1px solid var(--border)}
.consent:last-child{border-bottom:0}
.consent input{width:20px;height:20px;accent-color:var(--plum);margin:1px 0 0}
.consent b{color:var(--ink)}
/* garden */
.gardenWrap{padding:0 10px}
.garden{width:100%;display:block}
.bed{cursor:pointer}
.bedLabel{font-size:12.5px;font-weight:800;fill:var(--ink)}
.bedSub{font-size:10.5px;fill:var(--soft)}
.sway{transform-origin:0 0;animation:sway 6s ease-in-out infinite}
.flutter{transform-origin:0 0;animation:flutter .9s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
.plantCard{display:flex;gap:12px;align-items:center;margin:0 22px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 14px 10px 8px}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@media(prefers-reduced-motion:reduce){.sway,.flutter{animation:none}}
.welcome{margin:4px 22px 14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 22px 18px}
.quick button{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:left}
.quick b{display:block;font-size:14px;margin-top:6px}
.quick small{color:var(--soft);font-size:12px}
.qicon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:15px}
.ico{width:58%;height:58%;display:block}
.nextCard{width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px}
.dayCard{display:flex;gap:12px;align-items:center;margin:0 22px 16px;background:#f7eef2;border:1px solid #ecd9e1;border-radius:16px;padding:12px 14px}
.dayAvatar{width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-size:18px;flex:none;overflow:hidden}
.dayAvatar img{width:100%;height:100%;object-fit:cover}
.dayCard audio{width:100%;margin-top:8px;height:34px}
.soon{font-size:10.5px;font-weight:900;color:var(--rose2);background:#fff;border:1px solid #ecd9e1;border-radius:999px;padding:3px 8px;white-space:nowrap}
/* station */
.stationHero{display:flex;align-items:center;gap:14px;margin:6px 22px 8px}
.iconBox{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:22px;flex:none}
.missionCard{display:grid;grid-template-columns:28px 1fr 14px;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;width:100%}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;color:#fff;font-size:13px}
.done .check{background:var(--sage);border-color:var(--sage)}
.missionView{padding:6px 24px calc(24px + var(--safe-b));min-height:calc(100% - 60px);display:flex;flex-direction:column}
.content p{font-size:15px;line-height:1.65;color:var(--soft);margin-bottom:12px}
.content ul{padding-left:18px;margin:0 0 12px;color:var(--soft);font-size:15px;line-height:1.6}
.content strong{color:var(--ink)}
.cl{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);font-size:14.5px;line-height:1.45}
.cl input{width:20px;height:20px;accent-color:var(--sage);margin-top:1px;flex:none}
.emos{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.emo{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:9px 13px;font-size:13.5px;font-weight:700;color:var(--soft)}
.emo.on{background:var(--rose);border-color:var(--rose);color:#fff}
.breath{display:grid;place-items:center;margin:20px 0}
.breathCircle{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#fff 0,#f3e4ea 60%,#e8cfd9 100%);display:grid;place-items:center;transition:transform 4s ease-in-out;font-family:Fraunces,Georgia,serif;font-size:18px;color:var(--plum);text-align:center;padding:20px}
.breathCircle.in{transform:scale(1.22)}
/* tabs inside diario */
.seg{display:flex;background:var(--cream);border-radius:12px;padding:4px;margin:0 22px 14px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:800;font-size:13px;color:var(--soft)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(46,36,54,.08)}
.entry .meta{font-size:11.5px;color:var(--mute);font-weight:700;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.entry .txt{font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
.pillEmo{background:#f6ecf0;color:var(--rose2);border-radius:999px;padding:2px 8px;font-size:11px}
.seedT{font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.35;margin:6px 0 0;color:var(--ink)}
.relatoT{font-family:Fraunces,Georgia,serif;font-size:16px;line-height:1.45;color:var(--ink);margin:6px 0 4px}
button.card{font:inherit;color:inherit;display:block;width:100%;text-align:left}
.inp{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--card);font:inherit;font-size:15px;width:100%;outline:none}
.livroTxt p{font-family:Fraunces,Georgia,serif;font-size:16px;line-height:1.7;color:var(--ink);margin:0 0 12px}
.livroTxt .fade{height:70px;margin-top:-70px;position:relative;background:linear-gradient(rgba(255,255,255,0),#fff)}
.empty{text-align:center;color:var(--mute);font-size:13.5px;padding:28px 10px}
/* apoio */
.sos{background:var(--plum);color:#fff;border-radius:18px;padding:16px;margin:0 22px 14px}
.sos h2{color:#fff}
.sos p{color:#e7dfec;font-size:13.5px;line-height:1.5;margin:6px 0 12px}
.sosBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sosBtns a{display:block;text-align:center;background:#fff;color:var(--plum);text-decoration:none;font-weight:800;border-radius:12px;padding:12px 8px;font-size:14px}
.sosBtns a.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.apoioCard{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start;position:relative}
.apoioIcon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900}
.lockTag,.freeTag{position:absolute;right:12px;top:12px;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}
.lockTag{background:var(--goldSoft);border:1px solid var(--goldLine);color:var(--gold)}
.freeTag{background:#eef4ef;border:1px solid #dbe6db;color:#56705f}
/* bottom nav */
.bottom{background:var(--card);border-top:1px solid var(--border);display:flex;padding:8px 10px calc(10px + var(--safe-b));gap:2px}
.tab{flex:1;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:10.5px;font-weight:800}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--plum)}
.toast{position:absolute;left:50%;top:calc(18px + var(--safe-t));transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;z-index:20}
.toast.on{opacity:1}
.profileRing{display:flex;justify-content:center;margin:8px 0 20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== Refino visual (out/2026) ===== */
:root{--shadow:0 1px 2px rgba(46,36,54,.04),0 8px 24px -12px rgba(46,36,54,.18);--shadow2:0 2px 4px rgba(46,36,54,.05),0 14px 34px -14px rgba(46,36,54,.26);--r:18px}
.phone{background:radial-gradient(120% 60% at 50% -10%,#fff8ee 0%,var(--bg) 55%)}
.card,.nextCard,.quick button,.choice,.dayCard{border:1px solid rgba(233,224,214,.7);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
button.card:active,.nextCard:active,.quick button:active,.choice:active,[data-page]:active{transform:scale(.985)}
.primary{background:linear-gradient(135deg,#d4a858 0%,var(--gold) 55%,#b8893c 100%);box-shadow:0 8px 20px -8px rgba(199,154,75,.55);letter-spacing:.01em;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
.primary:active:not(:disabled){transform:scale(.98);filter:brightness(.97)}
.secondary{box-shadow:var(--shadow);transition:transform .15s ease}
.secondary:active{transform:scale(.98)}
h1{letter-spacing:-.012em}
.title{letter-spacing:-.01em}
.welcome h1{font-size:25px}
.eyebrow,.tag{letter-spacing:.09em}
.bottom{position:relative;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid rgba(233,224,214,.6);box-shadow:0 -10px 30px -18px rgba(46,36,54,.25);padding-top:7px}
.tab{position:relative;border-radius:14px;transition:color .2s ease,transform .2s ease}
.tab span,.tab svg{position:relative;z-index:1}
.tab.on::before{content:"";position:absolute;inset:2px 10px;border-radius:14px;background:linear-gradient(180deg,#f6eef2,#f1e4ea);z-index:0}
.tab:active{transform:scale(.94)}
.seg{box-shadow:inset 0 1px 2px rgba(46,36,54,.06)}
.seg button{transition:background .2s ease,color .2s ease}
.field input,textarea,.inp{transition:border-color .2s ease,box-shadow .2s ease}
.field input:focus,textarea:focus,.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(199,154,75,.14);outline:none}
.toast{background:rgba(74,59,82,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 24px -10px rgba(46,36,54,.5)}
.sos{background:linear-gradient(140deg,#54445d 0%,var(--plum) 60%,#3e3146 100%);box-shadow:0 14px 30px -14px rgba(74,59,82,.6)}
.qicon,.apoioIcon,.iconBox{box-shadow:inset 0 -2px 4px rgba(0,0,0,.08),0 4px 10px -4px rgba(46,36,54,.3)}
.view{animation:viewIn .32s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.garden .bed{cursor:pointer}
.garden .bed:active .sway{opacity:.75}
.gardenWrap{filter:drop-shadow(0 10px 24px rgba(46,36,54,.08))}
.bedLabel{font-weight:800}
/* Tela do vídeo de boas-vindas */
.vwrap{position:relative;flex:1;border-radius:24px;overflow:hidden;background:#2e2436;box-shadow:var(--shadow2);min-height:420px;display:grid;place-items:center}
.vwrap video,.vwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vwrap .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,36,54,.05) 40%,rgba(46,36,54,.75) 100%)}
.vplay{position:relative;z-index:2;width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);transition:transform .15s ease}
.vplay:active{transform:scale(.94)}
.vplay svg{width:30px;height:30px;margin-left:4px}
.vcap{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;color:#fff}
.vcap .tag{color:rgba(255,255,255,.8)}
.vcap h2{color:#fff;font-size:20px;margin-top:4px}
.vmute{position:absolute;top:14px;right:14px;z-index:3;border:0;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;font-size:12px;font-weight:800;padding:7px 11px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@media(prefers-reduced-motion:reduce){.view{animation:none}}
</style>
</head>

{id:'acolhimento',nome:'Acolhimento',sub:'Chegar com calma',cor:C.rose,icon:'sun',
 intro:'Aqui não existe jeito certo de sentir. A primeira estação é só para você chegar, respirar e ser [[ouvida|ouvido|escutada ou escutado]].',
 missoes:[
  {id:'a1',tipo:'escrita',titulo:'Conte sua história, do seu jeito',dur:'10 min',
   texto:'<p>Não existe forma certa de começar. Escreva como chegou até aqui: o que aconteceu, quanto tempo faz, o que mudou e o que pesa mais agora.</p><p>Ninguém vai ler isso além de você.</p>',placeholder:'Eu cheguei até aqui porque...'},
  {id:'a2',tipo:'checkin',titulo:'Como você está chegando hoje?',dur:'2 min',

  {id:'a3',tipo:'respiracao',titulo:'Primeiros socorros: respirar junto',dur:'3 min',
   texto:'<p>Quando a dor aperta, o corpo entra em alerta. Respirar devagar avisa ao corpo que, neste minuto, você está [[segura|seguro|em segurança]].</p><p>Inspire acompanhando o círculo crescer e solte o ar quando ele diminuir.</p>'},
  {id:'a4',tipo:'leitura',titulo:'O que é normal sentir no começo',dur:'4 min',
   texto:'<p>Nas primeiras semanas e meses é comum sentir <strong>cansaço extremo, esquecimento, irritação, culpa, alívio, raiva e saudade</strong> — às vezes tudo no mesmo dia.</p><p>O luto não segue fases em ordem nem tem prazo. Ele vem em ondas: dias mais leves e dias em que tudo volta.</p><p>Procure ajuda profissional se, por várias semanas, você não conseguir comer, dormir ou cuidar do básico, ou se surgirem pensamentos de não querer viver. Nesses momentos, ligue para o <strong>CVV no 188</strong> (24h, gratuito).</p>'}
 ]},
{id:'travessia',nome:'A Travessia',sub:'O lado prático',cor:C.sky,icon:'doc',
 intro:'Documentos, direitos e dinheiro. Uma coisa de cada vez — e você não precisa resolver tudo hoje.',
 missoes:[
  {id:'t1',tipo:'checklist',titulo:'Documentos essenciais: o que reunir',dur:'15 min',
   texto:'<p>Uma lista para você não precisar lembrar de tudo [[sozinha|sozinho|por conta própria]]. Marque o que já tem em mãos.</p>',
   itens:['Certidão de óbito','RG e CPF da pessoa que faleceu','Certidão de casamento ou comprovante de união estável','Certidões de nascimento dos filhos','Documentos de imóveis e veículos','Extratos e contas bancárias','Apólices de seguro de vida','Comprovante de residência']},
  {id:'t2',tipo:'leitura',titulo:'Pensão por morte, sem juridiquês',dur:'5 min',
   texto:'<p>A pensão por morte do INSS é paga aos dependentes de quem contribuía ou era aposentado — como cônjuge ou companheira e filhos menores de 21 anos.</p><p><strong>Atenção ao prazo:</strong> pedindo em até 90 dias após o óbito, o benefício costuma ser pago desde a data da morte. Depois disso, conta a partir da data do pedido.</p><p>O pedido é feito pelo app ou site <strong>Meu INSS</strong> ou pelo telefone <strong>135</strong>. Na dúvida, procure um advogado previdenciário ou a Defensoria Pública.</p>'},
  {id:'t3',tipo:'leitura',titulo:'Inventário explicado em linguagem simples',dur:'5 min',
   texto:'<p>Inventário é o processo que organiza e transfere os bens de quem faleceu para os herdeiros.</p><ul><li>Pode ser feito <strong>em cartório</strong> (mais rápido) quando há acordo entre os herdeiros, ou <strong>na Justiça</strong>.</li><li>A lei prevê abrir o inventário em até <strong>2 meses</strong> após o óbito; o atraso pode gerar multa no imposto (ITCMD), conforme o estado.</li><li>Em qualquer caso, é preciso um advogado.</li></ul><p>Não precisa decidir nada hoje. Só saber que esse passo existe já ajuda a planejar.</p>'},
  {id:'t4',tipo:'checklist',titulo:'Retrato financeiro, sem ansiedade',dur:'10 min',
   texto:'<p>Um retrato simples para dar clareza. Marque o que você já conseguiu levantar.</p>',
   itens:['O que entra todo mês (salário, pensão, outras rendas)','Contas fixas (moradia, luz, água, escola, plano de saúde)','Dívidas e parcelas em aberto','Seguros, previdência privada e investimentos','Assinaturas e débitos automáticos a cancelar']},
  {id:'t5',tipo:'leitura',titulo:'FGTS e PIS/PASEP de quem partiu',dur:'4 min',
   texto:'<p>Os saldos de <strong>FGTS</strong> e de <strong>PIS/PASEP</strong> da pessoa que faleceu podem ser sacados pelos dependentes.</p><ul><li>O caminho mais comum é pedir ao INSS a <strong>certidão de dependentes habilitados à pensão por morte</strong> e levá-la à Caixa (FGTS e PIS) ou ao Banco do Brasil (PASEP).</li><li>Quando não há dependentes no INSS, o saque costuma depender de <strong>alvará judicial</strong> ou do inventário.</li></ul><p>Confirme os documentos exigidos direto no banco antes de ir — as regras podem mudar.</p>'},
  {id:'t6',tipo:'leitura',titulo:'Existe um seguro de vida?',dur:'4 min',
   texto:'<p>Muita gente tem seguro de vida sem saber: pelo <strong>empregador</strong>, pelo <strong>banco</strong>, pelo <strong>cartão de crédito</strong>, junto com um <strong>financiamento</strong> ou em um plano de previdência.</p><p>Vale perguntar em cada um desses lugares se havia alguma apólice em nome da pessoa e quem são os beneficiários. Guarde os protocolos de cada contato.</p><p>Se houver financiamento de imóvel, o seguro habitacional pode quitar o saldo devedor — pergunte ao banco.</p>'},
  {id:'t7',tipo:'checklist',titulo:'Contas e serviços para encerrar ou transferir',dur:'10 min',
   texto:'<p>Não precisa ser tudo de uma vez. Marque conforme for resolvendo — e peça ajuda a alguém de confiança.</p>',
   itens:['Contas bancárias e cartões de crédito','Linha de celular e internet','Assinaturas (streaming, aplicativos, academia)','Contas de luz, água e gás no nome da pessoa','Redes sociais (memorial ou exclusão)','Plano de saúde e convênios','Documentos do veículo']}
 ]},
{id:'elo',nome:'O Elo',sub:'O amor continua',cor:C.rose2,icon:'heart',

  {id:'e1',tipo:'carta',titulo:'Escreva sua carta',dur:'15 min',

  {id:'e2',tipo:'memoria',titulo:'Plante uma memória',dur:'5 min',

  {id:'e3',tipo:'escrita',titulo:'Datas que importam',dur:'5 min',

{id:'reancoragem',nome:'Reancoragem',sub:'Chão debaixo dos pés',cor:C.sage,icon:'anchor',

  {id:'r2',tipo:'respiracao',titulo:'Para noites difíceis',dur:'5 min',

  {id:'r3',tipo:'checklist',titulo:'Cuidar do corpo esta semana',dur:'2 min',
   texto:'<p>O luto também mora no corpo. Marque o que você conseguiu fazer — e seja gentil com o que ainda não deu.</p>',

  {id:'r4',tipo:'leitura',titulo:'Como falar com as crianças',dur:'5 min',cond:a=>a.filhos==='Sim',
   texto:'<p>Crianças também vivem o luto — do jeito delas e em ondas, às vezes brincando logo depois de chorar.</p><ul><li>Use palavras <strong>simples e verdadeiras</strong>, como “morreu”. Evite “foi viajar” ou “está dormindo”, que confundem e assustam.</li><li>Deixe que perguntem, mesmo que repitam a mesma pergunta muitas vezes.</li><li>Mostrar que você também está triste ensina que sentir é permitido.</li><li>Mantenha o máximo possível da <strong>rotina</strong>: escola, horários, refeições.</li></ul><p>Procure um psicólogo infantil se, depois de algumas semanas, a criança tiver mudanças fortes de sono, apetite, comportamento ou rendimento escolar.</p>'}
 ]},

/* Linguagem: [[feminino|masculino|neutro]] escolhido no cadastro */
function gen(){const g=(state.answers||{}).genero||'';return g.startsWith('No fem')?0:g.startsWith('No masc')?1:2}
function gx(h){const i=gen();return h.replace(/\[\[([^\]|]*)\|([^\]|]*)\|([^\]]*)\]\]/g,(_,a,b,c)=>[a,b,c][i])}
/* Trilha: luto (padrão) ou separação */
const TRILHAS=window.RV_TRILHAS||{};
function trk(){return ((state.answers||{}).situacao||'').startsWith('Estou vivendo')?'separacao':'luto'}
const BASE_STATIONS=JSON.parse(JSON.stringify(STATIONS.map(st=>Object.assign({},st,{missoes:st.missoes.map(m=>Object.assign({},m,{cond:undefined}))}))));
const CONDS={};STATIONS.forEach(st=>st.missoes.forEach(m=>{if(m.cond)CONDS[m.id]=m.cond}));
function applyTrack(){const T=TRILHAS[trk()];STATIONS.length=0;BASE_STATIONS.forEach(b=>{const st=Object.assign({},b);if(T&&T.estacoes&&T.estacoes[st.id])Object.assign(st,T.estacoes[st.id]);st.cor=C[{acolhimento:'rose',travessia:'sky',elo:'rose2',reancoragem:'sage',ressignificacao:'terra',reviva:'plum'}[st.id]];st.missoes=b.missoes.map(m=>{const mm=Object.assign({},m);if(T&&T.missoes&&T.missoes[m.id])Object.assign(mm,T.missoes[m.id]);if(CONDS[m.id])mm.cond=CONDS[m.id];return mm});STATIONS.push(st)})}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}
function vis(st){return st.missoes.filter(m=>!m.cond||m.cond(state.answers))}
function doneCount(st){return vis(st).filter(m=>state.done[m.id]).length}
function stationProgress(st){return doneCount(st)/vis(st).length}
function totalProgress(){let all=0,d=0;STATIONS.forEach(s=>vis(s).forEach(m=>{all++;if(state.done[m.id])d++}));return all?d/all:0}
function stageOf(p){return p===0?0:p<0.5?1:p<1?2:3}
/* o Acolhimento já nasce como broto: a pessoa entra no jardim com algo vivo */
function plantStage(st){const s=stageOf(stationProgress(st));return st.id==='acolhimento'?Math.max(1,s):s}
const recent=()=>{const t=state.answers.tempo||'';return t.startsWith('Menos')}

/* ---------- Ilustrações ---------- */
function plantSVG(cor,stage){
 const soil='<ellipse cx="0" cy="2" rx="34" ry="9" fill="#e7dccd"/><ellipse cx="0" cy="0" rx="26" ry="6" fill="#d9c9b4"/>';
 if(stage===0)return soil+'<ellipse cx="0" cy="-3" rx="5" ry="3.5" fill="#b49a7c"/>';
 const leaf=(x,y,r,s)=>`<path d="M${x},${y} q${12*s},-10 ${22*s},-2 q${-10*s},10 ${-22*s},2z" fill="#8fa596" transform="rotate(${r} ${x} ${y})"/>`;
 let stemH=stage===1?26:stage===2?50:62;
 let g=soil+`<g class="sway"><path d="M0,0 C-2,${-stemH*.4} 2,${-stemH*.7} 0,${-stemH}" stroke="#7c9188" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 g+=leaf(0,-stemH*.35,-18,1)+leaf(0,-stemH*.45,18,-1);
 if(stage>=2)g+=leaf(0,-stemH*.7,-12,1);
 if(stage===2)g+=`<ellipse cx="0" cy="${-stemH-6}" rx="7" ry="10" fill="${cor}"/><path d="M-6,${-stemH} q6,-6 12,0" fill="#8fa596"/>`;
 if(stage===3){let p='';for(let i=0;i<6;i++){p+=`<ellipse cx="0" cy="${-stemH-13}" rx="7.5" ry="13" fill="${cor}" opacity=".92" transform="rotate(${i*60} 0 ${-stemH})"/>`}g+=p+`<circle cx="0" cy="${-stemH}" r="6.5" fill="#C79A4B"/>`}
 return g+'</g>';
}

const PLANTAS={
 acolhimento:{nome:'Camomila',sig:'A flor do chá que se oferece a quem sofre. Pequena, humilde e calmante: colo em forma de planta.'},

};
const GV={leaf:'#7C9188',leafL:'#A3B8A8',leafD:'#5E7769',stem:'#6F8A7B',bark:'#8A7058',barkD:'#6E5743'};
const lf=(x,y,len,wid,ang,c,rib=true)=>`<g transform="translate(${x} ${y}) rotate(${ang})"><path d="M0,0 C${wid},${-len*.3} ${wid*.9},${-len*.78} 0,${-len} C${-wid*.9},${-len*.78} ${-wid},${-len*.3} 0,0Z" fill="${c}"/>${rib?`<path d="M0,-1 L0,${-len*.86}" stroke="#ffffff" stroke-opacity=".28" stroke-width=".8" fill="none"/>`:''}</g>`;
const soil=(w=32)=>`<ellipse cx="0" cy="4" rx="${w+6}" ry="9" fill="#E9DFD1"/><path d="M${-w},2 Q0,-7 ${w},2 Q0,8 ${-w},2Z" fill="#D8C7B0"/><path d="M${-w*.55},0 q4,-2 8,0 M${w*.2},-1 q3,-2 7,0" stroke="#C6B298" stroke-width="1" fill="none" stroke-linecap="round"/>`;
const pond=()=>`<ellipse cx="0" cy="3" rx="40" ry="10" fill="#E3ECE8"/><ellipse cx="0" cy="2" rx="34" ry="7.5" fill="#C7DAD8"/><path d="M-20,1 q6,-2 12,0 M6,4 q6,-2 12,0" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;
const stemC=(x1,y1,x2,y2,bend,w=2.4,c=GV.stem)=>`<path d="M${x1},${y1} Q${(x1+x2)/2+bend},${(y1+y2)/2} ${x2},${y2}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
function butterfly(x,y,c1,c2){return `<g transform="translate(${x} ${y})"><g class="flutter"><path d="M0,0 C-7,-9 -14,-5 -11,1 C-9,5 -3,4 0,0Z" fill="${c1}"/><path d="M0,0 C-6,3 -9,9 -4,9 C-1,8 0,4 0,0Z" fill="${c2}"/><path d="M0,0 C7,-9 14,-5 11,1 C9,5 3,4 0,0Z" fill="${c1}"/><path d="M0,0 C6,3 9,9 4,9 C1,8 0,4 0,0Z" fill="${c2}"/></g><path d="M0,-3 L0,6" stroke="#4A3B52" stroke-width="1.2" stroke-linecap="round"/></g>`}

/* Girassol */
function girassol(s){
 if(s===1)return stemC(0,0,0,-16,1)+`<ellipse cx="-6" cy="-17" rx="6" ry="3.2" fill="${GV.leafL}" transform="rotate(-20 -6 -17)"/><ellipse cx="6" cy="-17" rx="6" ry="3.2" fill="${GV.leaf}" transform="rotate(20 6 -17)"/>`;
 if(s===2)return stemC(0,0,2,-58,-4,2.8)+lf(0,-16,22,9,-58,GV.leaf)+lf(1,-30,24,10,55,GV.leafD)+lf(2,-44,15,6,-40,GV.leafL)+
  `<g transform="translate(2 -62)">${[0,45,90,135,180,225,270,315].map(a=>`<path d="M0,-6 L2,-11 L-2,-11Z" fill="#E2B85A" transform="rotate(${a})"/>`).join('')}<circle r="7" fill="#8FA77F"/><circle r="4" fill="#7E9670"/></g>`;
 let petals='';for(let i=0;i<18;i++){petals+=`<ellipse cx="0" cy="-15" rx="3.6" ry="9.5" fill="${i%2?'#E6BE5F':'#D9A944'}" transform="rotate(${i*20})"/>`}
 let inner='';for(let i=0;i<18;i++){inner+=`<ellipse cx="0" cy="-11" rx="2.6" ry="6.5" fill="#EFCB74" transform="rotate(${i*20+10})"/>`}
 let dots='';for(let i=0;i<14;i++){const a=i*137.5*Math.PI/180,r=Math.sqrt(i+1)*1.9;dots+=`<circle cx="${(Math.cos(a)*r).toFixed(1)}" cy="${(Math.sin(a)*r).toFixed(1)}" r=".9" fill="#C89A55"/>`}
 return stemC(0,0,4,-66,-6,3)+lf(0,-16,24,10,-60,GV.leaf)+lf(1,-30,26,11,58,GV.leafD)+lf(3,-46,18,7,-42,GV.leafL)+
  `<g transform="translate(5 -72) rotate(-8)">${petals}${inner}<circle r="9.5" fill="#6E4E33"/><circle r="6.5" fill="#5A3E28"/>${dots}</g>`;

 if(act==='vplay'){const v=$('#vday');if(!v)return;t.closest('.vplay').style.display='none';v.setAttribute('controls','');v.muted=false;v.play().catch(()=>{});track('video_boasvindas');return}
 if(act==='vnext'){const v=$('#vday');if(v){try{v.pause()}catch(_){}}state.vid=1;state.slide=2;save();render();return}
 if(act==='nextSlide'){state.slide=Math.min(state.slide+1,SLIDES.length-1);save();render();return}
 if(act==='slidesDone'){track('apresentacao_concluida');state.step='lead';save();render();return}
 if(act==='leadNext'){saveLead();state.step='questions';state.qStep=0;save();render();return}
 if(act==='qBack'){state.qStep=Math.max(0,state.qStep-1);render();return}
 if(act==='finishOnb'){state.onboarded=true;applyTrack();applyContent();save();send({tipo:'perfil',evento:'onboarding_concluido',answers:state.answers});go({tab:'jardim',station:null,mission:null});return}
 const ans=t.closest('[data-answer]');
 if(ans){const q=QUESTIONS[state.qStep];state.answers[q.key]=ans.dataset.answer;if(state.qStep<QUESTIONS.length-1)state.qStep++;else state.step=state.onboarded?'done':'ready';save();if(state.step==='done'){state.step='ready';state.onboarded=true;save();applyTrack();applyContent();toast('Respostas atualizadas');go({tab:'perfil'});return}render();return}
 const tab=t.closest('[data-tab]');if(tab){track('aba',tab.dataset.tab);go({tab:tab.dataset.tab,station:null,mission:null});return}
 const seg=t.closest('[data-seg]');if(seg){route.seg=seg.dataset.seg;render();return}
 const emo=t.closest('[data-emo]');if(emo){emo.classList.toggle('on');return}
 const goq=t.closest('[data-go]');if(goq){if(goq.dataset.go==='checkin')go({station:'acolhimento',mission:'a2'});else go({station:'reancoragem',mission:'r2'});return}
 const mis=t.closest('[data-mission]');if(mis){go({station:mis.dataset.station||route.station,mission:mis.dataset.mission});return}
 const st=t.closest('[data-station]');if(st){go({station:st.dataset.station,mission:null});return}
 if(act==='backGarden'){go({station:null,mission:null});return}
 if(act==='backStation'){clearInterval(breathTimer);go({mission:null});return}
 if(t.id==='breath'){startBreath();return}
 if(act==='complete'){completeMission();return}
 if(act==='addDiary'){const emos=[...document.querySelectorAll('#emos .emo.on')].map(x=>x.dataset.emo);const txt=($('#mText')?.value||'').trim();if(!emos.length&&!txt){toast('Marque uma emoção ou escreva algo');return}state.diary.unshift({data:today(),emos,texto:txt});save();track('diario');toast('Registrado no seu diário');render();return}
 if(act==='remOn'){const h=+t.closest('[data-act]').dataset.hour||20;RevivaNative.reminders.enable(h).then(ok=>{state.rem=Object.assign({},state.rem,{asked:true,on:!!ok,hour:h});save();track('lembrete',ok?'on_'+h:'negado');toast(ok?'Lembrete ativado para as '+h+'h':'Para receber lembretes, permita notificações nos Ajustes do iPhone');render()});return}
 if(act==='remOff'){RevivaNative.reminders.disable();state.rem=Object.assign({},state.rem,{on:false,asked:true});save();track('lembrete','off');toast('Lembretes desligados');render();return}
 if(act==='remLater'){state.rem=Object.assign({},state.rem,{asked:true});save();render();return}
 if(act==='apagar'){if(confirm('Apagar todos os seus dados e registros deste aparelho? Isso não pode ser desfeito.')){if(window.RevivaNative)RevivaNative.reminders.disable();track('dados_apagados');try{localStorage.removeItem(STORE)}catch(_){}state=blank();route={tab:'jardim',station:null,mission:null,seg:'diario'};render()}return}
 if(act==='refazer'){state.qStep=0;state.step='questions';state.onboarded=false;save();render();return}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-check]');if(c){const [id,i]=c.dataset.check.split(':');state.checks[id]=state.checks[id]||{};state.checks[id][i]=c.checked;save()}});

function completeMission(){
 const {st,m}=findMission(route.mission);const txt=($('#mText')?.value||'').trim();
 if(m.tipo==='carta'||m.tipo==='memoria'||m.tipo==='escrita'){
  if(!txt){toast('Escreva algumas palavras antes');return}
  if(m.tipo==='carta')state.letters.unshift({data:today(),titulo:m.titulo,texto:txt});
  if(m.tipo==='memoria')state.memories.unshift({data:today(),texto:txt});
  if(m.tipo==='escrita')state.diary.unshift({data:today(),emos:[],texto:m.titulo+'\n\n'+txt});
  delete state.drafts[m.id];
 }
 if(m.tipo==='checkin'){const emos=[...document.querySelectorAll('#emos .emo.on')].map(x=>x.dataset.emo);if(!emos.length&&!txt){toast('Marque pelo menos uma emoção');return}state.diary.unshift({data:today(),emos,texto:txt})}
 if(state.done[m.id]&&!['carta','memoria','checkin','escrita'].includes(m.tipo)){go({mission:null});return}
 const before=stageOf(stationProgress(st));
 state.done[m.id]=Date.now();save();if(window.RevivaNative)RevivaNative.haptic();
 const after=stageOf(stationProgress(st));track(m.tipo==='checkin'?'checkin':'passo_concluido',m.id);if(after===3&&before<3)track('canteiro_floresceu',st.id);
 toast(after===3&&before<3?'O canteiro '+st.nome+' está em flor. Uma borboleta veio visitar.':after>before?'Algo cresceu no seu jardim':'Guardado com carinho');
 go({mission:null});
}
applyTrack();applyContent();render();track('app_aberto');loadRelatos();
if('serviceWorker' in navigator&&!(window.RevivaNative&&RevivaNative.isNative)){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
</script>
